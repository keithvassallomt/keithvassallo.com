  - id: statustray
    title: Status Tray
    shortDescription: Better tray icons for GNOME with customisation options
    description: Automatic system tray for applications using the StatusNotifierItem/DBusMenu protocol. Displays tray icons for apps like Discord, Slack, Dropbox, Nextcloud, Steam, and more. Supports symbolic (monochrome) and original icon modes, per-app icon customization, drag-and-drop reordering, and individual icon effect tuning.
    logo: /assets/projects/statustray/statustray_logo.png
