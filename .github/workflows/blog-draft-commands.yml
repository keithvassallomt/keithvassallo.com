# Commands Keith can comment on blog draft pull requests (docs/weekly-blog-draft.md):
#
#   /revise [request]  revise the draft from his comments. The revision itself runs in the
#                      private repository, with his voice guide and samples; this workflow
#                      only starts it, and never sees that material.
#   /publish           date the post today, drop `draft: true`, check the production build,
#                      merge, and reply once the post is live.
#
# Only Keith's own comments count, so nobody else can spend his API credit or publish.

name: Blog draft commands

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  revise:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'keithvassallomt' &&
      startsWith(github.event.comment.body, '/revise')
    runs-on: ubuntu-latest
    permissions:
      issues: write # react to the comment
      pull-requests: write
    steps:
      # The dispatch API needs only Actions: write, unlike `gh workflow run`, which may read
      # the workflow file
      - name: Start the revision
        env:
          GH_TOKEN: ${{ secrets.BLOG_PRIVATE_ACTIONS_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh api repos/keithvassallomt/blog-private/actions/workflows/revise-blog-draft.yml/dispatches \
            -f ref=main -f "inputs[pr]=$PR"

      - name: Acknowledge the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions" -f content=eyes

  publish:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'keithvassallomt' &&
      startsWith(github.event.comment.body, '/publish')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # commit to the draft branch, merge it and delete it
      pull-requests: write
      issues: write
    concurrency:
      group: blog-draft-publish
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Acknowledge the comment
        env:
          COMMENT: ${{ github.event.comment.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions" -f content=rocket

      - name: Find the draft
        id: pr
        run: |
          read -r state branch < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefName --jq '"\(.state) \(.headRefName)"')
          if [[ "$state" != OPEN || "$branch" != blog-draft/* ]]; then
            echo "#$PR is not an open blog draft"
            exit 1
          fi
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq '.title | sub("^Blog draft: "; "")')
          {
            echo "branch=$branch"
            echo "slug=${branch#blog-draft/}"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}

      # Only the frontmatter is touched, so a code sample in the body that happens to
      # contain "draft: true" survives
      - name: Mark it published
        env:
          SLUG: ${{ steps.pr.outputs.slug }}
        run: |
          file="src/content/blog/$SLUG/index.md"
          awk -v today="$(TZ=Europe/London date +%F)" '
            NR == 1 && $0 == "---" { inside = 1; print; next }
            inside && $0 == "---" { inside = 0 }
            inside && $0 == "draft: true" { next }
            inside && /^pubDate:/ { print "pubDate: " today; next }
            { print }
          ' "$file" > "$file.new"
          mv "$file.new" "$file"
          git diff

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check the production build includes it
        env:
          SLUG: ${{ steps.pr.outputs.slug }}
        run: |
          npm ci
          npm run build
          test -f "dist/blog/$SLUG/index.html" || { echo "The post is missing from the production build"; exit 1; }

      - name: Merge
        id: merge
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -am "Published blog post: $TITLE"
          git push origin "HEAD:$BRANCH"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f merge_method=squash -f commit_title="Added blog post: $TITLE (#$PR)" -f sha="$(git rev-parse HEAD)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"

      # The merge to main starts the CodePipeline deploy; this only watches for its result
      - name: Wait for it to go live
        env:
          URL: https://keithvassallo.com/blog/${{ steps.pr.outputs.slug }}
        run: |
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null "$URL"; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Published, and live at $URL"
              exit 0
            fi
            sleep 30
          done
          echo "Not live after 25 minutes"
          exit 1

      - name: Report a failure
        if: failure()
        env:
          MERGED: ${{ steps.merge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$MERGED" == success ]]; then
            message="Merged, but the post isn't live after 25 minutes. Check the CodePipeline deploy. Log: $RUN_URL"
          else
            message="Publishing stopped before merging, so nothing changed. Log: $RUN_URL"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$message"
